plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.10.2")

    testImplementation (
            "org.junit.jupiter:junit-jupiter",
            "com.codeborne:selenide:7.14.0",
            "com.github.javafaker:javafaker:1.0.2"
           )
}


tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}